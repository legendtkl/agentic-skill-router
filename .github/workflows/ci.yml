name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 07:13 UTC for the networked e2e layer.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      run_agent_e2e:
        description: "Run the agent e2e layer (requires a self-hosted runner with local codex/claude binaries + auth)"
        required: false
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:assets
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack
      - name: e2e (offline)
        run: npm run test:e2e:offline

  e2e-network:
    # Nightly schedule + manual dispatch only. Allowed to fetch external git repos.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: e2e (network)
        run: npm run test:e2e:network

  e2e-agent:
    # Manual dispatch only. Requires a self-hosted runner with the matching
    # label that has a local `codex` and `claude` binary on PATH plus the
    # corresponding auth configured (Codex auth, `~/.claude/.credentials.json`).
    # Hosted GitHub-managed runners do not satisfy this; without a matching
    # self-hosted runner the dispatched job will queue and never run, which
    # is intentional and signals that no agent-capable runner is available.
    if: github.event_name == 'workflow_dispatch' && inputs.run_agent_e2e == 'true'
    runs-on: [self-hosted, skill-router-agent-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify agent CLIs are available
        run: |
          set -e
          command -v codex >/dev/null || { echo "codex binary missing on runner PATH"; exit 1; }
          command -v claude >/dev/null || { echo "claude binary missing on runner PATH"; exit 1; }
      - name: e2e (agent)
        run: npm run test:e2e:agent
